{# One review, as it appears on the product page. Needs review. #}
<article class="card bg-base-100 shadow-sm">
  <div class="card-body gap-2 p-5">
    <div class="flex flex-wrap items-center gap-3">
      {% include "reviews/partials/_stars.html" with rating=review.rating %}
      <span class="font-semibold">{{ review.author.public_name }}</span>
      <span class="text-sm opacity-70">
        {{ review.created_at|date:"M j, Y" }}{% if review.was_edited %} (edited){% endif %}
      </span>
    </div>
    <p class="whitespace-pre-line">{{ review.comment }}</p>
  </div>
</article>
